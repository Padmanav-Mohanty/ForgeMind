# ForgeMind data pipeline configuration.
# All configurable values for download, conversion, cleaning, deduplication,
# and splitting live here. Nothing in the pipeline should need editing here
# except to tune behavior.

seed: 42

# ---------------------------------------------------------------------------
# Dataset enable flags: set a dataset to false to skip it entirely.
# ---------------------------------------------------------------------------
datasets:
  aifaultbench: true
  ghpr: true
  defects4j: true

# ---------------------------------------------------------------------------
# Train / validation / test split ratios (must sum to 1.0).
# ---------------------------------------------------------------------------
split:
  train: 0.8
  validation: 0.1
  test: 0.1

# ---------------------------------------------------------------------------
# Cleaning thresholds. Examples below these minimums are removed unless
# they carry code (code-bearing examples get a lower bar by design).
# ---------------------------------------------------------------------------
cleaning:
  min_input_length: 20      # user content minimum in characters
  min_output_length: 20     # assistant content minimum in characters
  min_input_length_code: 10
  min_output_length_code: 10

# ---------------------------------------------------------------------------
# Deduplication.
#   exact: SHA-256 over normalized user+assistant content.
#   near:  cosine similarity over token sets (cheap, stdlib-only). Pairs with
#          jaccard >= threshold are collapsed deterministically.
# ---------------------------------------------------------------------------
dedup:
  exact: true
  near: true
  near_threshold: 0.85

# ---------------------------------------------------------------------------
# Download behavior.
# ---------------------------------------------------------------------------
download:
  aifaultbench:
    # Which per-bug files to fetch for the converter. Logs can be large;
    # the converter uses stdout/stderr excerpts, not full logs.
    fetch_logs: true
    max_log_bytes: 20000
  ghpr:
    # The ghpr.csv index (14,384 issue<->PR rows). The raw repo holds one
    # JSON file per issue/PR; fetching every object is slow without
    # authentication, so the converter samples a bounded number of rows.
    sample_limit: 1500
    # When a HUGGINGFACE token is configured, raw JSON objects are fetched
    # from ghpr-dataset-raw for richer titles/bodies. Disable to use only
    # the CSV fields.
    fetch_raw_objects: true
  defects4j:
    # Sparse-checkout scope: framework metadata (bug tables, trigger tests)
    # plus the patch files. Project source code is deliberately excluded.
    include_test_patches: true

# ---------------------------------------------------------------------------
# Tokenization / token-length analysis (src/tokenization/, run via
# `python -m src.tokenization.tokenize_dataset` or scripts/analyze_tokens.py).
#   tokenizer_id: tokenizer-only load for length analysis. Must match the
#     model the QLoRA stage will fine-tune so measured lengths match
#     training-time sequence lengths. No model weights are downloaded.
#   candidate_max_seq_lengths: caps evaluated by the sequence-length
#     analysis. The final training cap lives in configs/qlora.yaml
#     (max_seq_length) and is set only after reviewing the report.
#   long_examples_report_limit: how many over-cap examples to list (with
#     indexes) in the saved report. All over-cap examples are counted
#     regardless of this limit.
#   trim_feasibility.section_char_budget: per-evidence-section character
#     budget used by the read-only trim feasibility simulation
#     (src/tokenization/trim_feasibility.py). Analysis only — nothing is
#     written back to the dataset by that stage.
# ---------------------------------------------------------------------------
tokenization:
  tokenizer_id: meta-llama/Llama-3.2-3B-Instruct
  candidate_max_seq_lengths: [1024, 2048, 4096]
  long_examples_report_limit: 50
  trim_feasibility:
    section_char_budget: 1200
